[workspace]
members = [".", "guest-app"]
resolver = "2"

[package]
name = "tauri-plugin-telephony"
version = "0.1.0"
description = "A robust Tauri plugin for telephony functionality including calls and SMS"
authors = ["Tauri Telephony Plugin Contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.70"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = "2.0"
log = "0.4"
thiserror = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_os = "ios")'.dependencies]
swift-rs = "1.0"

[build-dependencies]
tauri-plugin = { version = "2.0", features = ["build"] }

[dev-dependencies]
tauri = { version = "2.0", features = ["test"] }

[features]
default = []

[lib]
name = "tauri_plugin_telephony"
crate-type = ["staticlib", "cdylib", "rlib"]
